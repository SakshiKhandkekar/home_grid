<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>

    <style>
       
       table {
          background-color: rgb(218, 239, 233);
          border: 5px;;
          text-align: center;
          width: 600px;
          height: 400px;
         }

        label {
            color: #333;
            
        }

    </style>
</head>

<body bgcolor="lightblue">
    <center>
       
    <h1>Sign Up Form</h1>

    <form  method="get" action="">
        
    <table align="center" bgcolor="pink">


    <tr>
    <th><label>First Name:</label></th>
    <td><input type="text" placeholder="Enter First Name"></td>
    </tr>

     <tr>
    <th><label>Last Name:</label></th>
    <td><input type="text" placeholder="Enter Last Name"></td>
    </tr>

    <tr>
        <th><label>Email:</label></th>
    <td><input type="email"></td>
    </tr>

    <tr>
        <th><label>Mobile No.:</label></th>
    <td><input type="number"></td>
    </tr>

    <tr>
        <th><label>password:</label></th>
    <td><input type="password"></td>
    </tr>

     <tr>
    <th>Gender:</th>

    <td><input type="radio"  value="male">Male
    <input type="radio" value="female">
    Female
    </td>
    </tr>
    
    <tr>
         <th>Skills:</th>
         <td>
            <input type="checkbox" name="Skills" value="j">Java
            <input type="checkbox" name="Skills" value="p">Python
            <input type="checkbox" name="Skills" value="h">Html
         </td>
     </tr>

     <tr>
    <td></td>
    <td>
        <input type="submit" value="signup">
        <input type="reset" value="Cancel">
    </td>
     </tr>

</table>
    </form>
</center>
</body>
</html>
